<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JULMENU</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --primary: #4da3ff;
            --primary-dark: #1b5fb0;
            --primary-glow: rgba(77, 163, 255, 0.45);
            --bg-main: rgba(8, 12, 20, 0.98);
            --bg-card: rgba(10, 15, 24, 0.96);
            --bg-item-hover: rgba(77, 163, 255, 0.08);
            --text-main: #dfe6f0;
            --text-dim: #7c8797;
            --border-color: rgba(77, 163, 255, 0.15);
        }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { 
            background-color: transparent !important; 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main); 
            user-select: none; 
        }

        /* --- Adaptation à la résolution ---
           Tout est conçu pour une résolution de référence 1920x1080.
           Le JS calcule ensuite l'échelle réelle (voir scaleUI()) pour que
           le menu garde toujours les mêmes proportions, quelle que soit
           la résolution du joueur (1080p, 1440p, 4K, ultrawide...). */
        #ui-scale {
            width: 1920px;
            height: 1080px;
            transform-origin: top left;
            position: relative;
        }

        .container { 
            pointer-events: auto;
            padding: 40px; 
            display: flex; 
            justify-content: flex-start; 
            align-items: flex-start; 
            gap: 20px;
            min-height: 100%; 
            transition: filter 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .container.blur { filter: blur(12px) brightness(0.5); }

        .info-panel {
            width: 280px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: none;
            flex-direction: column;
            animation: infoEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes infoEntry {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .info-header {
            padding: 15px 20px;
            background: #050505;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .info-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .info-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-stat {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-label {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: white;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .stat-bar-fill.health { background: #4caf50; box-shadow: 0 0 10px rgba(76, 175, 80, 0.3); }
        .stat-bar-fill.armor { background: #2196f3; box-shadow: 0 0 10px rgba(33, 150, 243, 0.3); }

        .info-footer {
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid var(--border-color);
            font-size: 10px;
            color: var(--text-dim);
            font-style: italic;
        }

        .menu-wrap {
            position: relative;
        }

        .side-bar {
            position: absolute;
            left: -8px;
            top: 130px;
            bottom: 0;
            width: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }

        .side-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8%;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
            border-radius: 2px;
            transition: top 0.25s cubic-bezier(0.16, 1, 0.3, 1), height 0.25s;
        }

        .menu-card { 
            width: 400px; 
            display: flex; 
            flex-direction: column; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
            background-color: var(--bg-main);
            position: relative;
        }

        .header { 
            height: 130px; 
            background: linear-gradient(135deg, #0f1826 0%, #060a12 100%);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            position: relative; 
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 120%;
            height: 50%;
            background: radial-gradient(circle, rgba(77, 163, 255, 0.18) 0%, transparent 70%);
            filter: blur(20px);
        }

        .header::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(115deg, transparent 46%, rgba(255,255,255,0.05) 47%, rgba(255,255,255,0.05) 48%, transparent 49%),
                linear-gradient(115deg, transparent 60%, rgba(255,255,255,0.04) 61%, rgba(255,255,255,0.04) 62%, transparent 63%);
        }

        .logo { 
            font-size: 34px; 
            font-weight: 800; 
            color: white; 
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 20px rgba(77, 163, 255, 0.4);
        }

        .logo .bolt { color: var(--primary); filter: drop-shadow(0 0 6px var(--primary-glow)); }
        .logo span { color: var(--primary); }

        .logo-sub {
            position: relative;
            z-index: 1;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 8px;
            color: var(--text-dim);
            margin-top: 6px;
            padding-left: 8px;
        }

        .tab-bar { 
            display: flex; 
            align-items: center; 
            background: #050810; 
            padding: 0 4px;
            height: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab { 
            flex: 1;
            padding: 0 16px; 
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            color: var(--text-dim);
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active { 
            color: white;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15%;
            width: 70%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            border-radius: 2px 2px 0 0;
        }

        .tab-spacer { flex: 0; }


        .menu-body { display: flex; position: relative; background: var(--bg-card); }

        .items-list { 
            flex: 1; 
            padding: 10px 0; 
            max-height: 600px;
            overflow: hidden;
        }

        .menu-item { 
            position: relative; 
            padding: 13px 20px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 1px 0;
            border-radius: 0;
            border-left: 3px solid transparent;
        }

        .menu-item.selected { 
            background: linear-gradient(90deg, rgba(77,163,255,0.35) 0%, rgba(77,163,255,0.08) 100%);
            border-left: 3px solid var(--primary);
            box-shadow: inset 0 0 20px rgba(77, 163, 255, 0.08);
        }

        .item-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
        }
        .item-icon svg { width: 100%; height: 100%; stroke: currentColor; }
        .selected .item-icon { color: var(--primary); filter: drop-shadow(0 0 4px var(--primary-glow)); }

        .item-text { 
            flex: 1;
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-main); 
        }

        .selected .item-text { color: white; }

        .checkbox { 
            width: 32px; 
            height: 16px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 10px; 
            position: relative; 
            transition: background 0.3s ease;
        }

        .checkbox::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .checkbox.checked { background: #4caf50; }
        .selected .checkbox.checked { background: white; }
        .selected .checkbox.checked::after { background: var(--primary); }
        
        .checkbox.checked::after { transform: translateX(16px); }

        .chevron { 
            color: var(--text-dim); 
            width: 14px;
            height: 14px;
            display: inline-flex;
            flex-shrink: 0;
        }
        .chevron svg { width: 100%; height: 100%; stroke: currentColor; }
        .selected .chevron { color: var(--primary); }

        .scrollbar { 
            width: 4px; 
            background-color: transparent; 
            margin: 10px 4px 10px 0;
            border-radius: 2px;
        }

        .scroll-track { 
            flex: 1; 
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05); 
            border-radius: 2px; 
            position: relative; 
        }

        .scroll-thumb { 
            position: absolute; 
            width: 100%; 
            background-color: var(--primary); 
            box-shadow: 0 0 10px var(--primary-glow); 
            border-radius: 2px; 
            transition: top 0.25s cubic-bezier(0.16, 1, 0.3, 1), height 0.25s; 
        }

        .footer { 
            background-color: #050810; 
            border-top: 1px solid var(--border-color); 
            padding: 12px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        .footer-left { display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .footer-logo { 
            width: 14px; 
            height: 14px; 
            color: var(--primary); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            filter: drop-shadow(0 0 4px var(--primary-glow));
        }
        .footer-text { color: white; opacity: 0.9; }
        .footer-counter { 
            color: var(--primary); 
            font-family: 'JetBrains Mono', monospace;
            background: rgba(77, 163, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }


        #keyboard-overlay { 
            position: absolute; 
            inset: 0; 
            background: rgba(5, 8, 16, 0.97); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 50; 
            border-radius: 12px;
            pointer-events: auto;
        }
        .keyboard-card { 
            width: 90%; 
            background: rgba(10, 10, 10, 0.98); 
            border: 1px solid var(--primary); 
            border-radius: 12px; 
            overflow: hidden; 
            animation: kbSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
            pointer-events: auto;
        }
        @keyframes kbSlideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .kb-header { 
            padding: 12px 20px; 
            background: linear-gradient(to right, #0a1420, #050810);
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid var(--border-color); 
        }
        .kb-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); }
        .kb-body { padding: 20px; }
        .kb-input-display { 
            min-height: 50px; 
            background: #000; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 6px; 
            padding: 0 15px; 
            color: white; 
            font-size: 18px; 
            display: flex; 
            align-items: center; 
            font-family: 'JetBrains Mono', monospace;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .kb-cursor { width: 2px; height: 20px; background: var(--primary); margin-left: 4px; box-shadow: 0 0 8px var(--primary); animation: blink 1s infinite steps(2); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .kb-footer { 
            padding: 10px 20px; 
            background: #050505; 
            border-top: 1px solid rgba(255, 255, 255, 0.03); 
            display: flex; 
            justify-content: center; 
            gap: 20px;
            font-size: 9px; 
            color: var(--text-dim); 
            font-weight: 700; 
        }
        .kb-command { display: flex; align-items: center; gap: 6px; }
        .kb-key { color: var(--primary); font-weight: 800; }

        .notifications { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            z-index: 9999; 
        }
        .notification { 
            min-width: 280px; 
            padding: 16px 20px; 
            border-radius: 10px; 
            background: rgba(10, 10, 10, 0.95); 
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            font-size: 13px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .notification::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
        }
        .notification.success::before { background: #4caf50; }
        .notification.error::before { background: #f44336; }
        
        @keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="ui-scale">
    <div class="notifications" id="notifications"></div>
    <div class="container" id="main-container">
        <div class="menu-wrap">
        <div class="side-bar"><div class="side-indicator" id="side-indicator"></div></div>
        <div class="menu-card">
            <div class="header">
                <div class="logo">JUL<span>MENU</span></div>
                <div class="logo-sub">M E N U</div>
            </div>
            <div class="tab-bar" id="tab-bar">
                <div class="tab active">Main Menu</div>
                <div class="tab-spacer"></div>
            </div>
            <div class="menu-body">
                <div class="items-list" id="items-list"></div>
                <div class="scrollbar"><div class="scroll-track"><div class="scroll-thumb" id="scroll-thumb"></div></div></div>
            </div>
            <div class="footer">
                <div class="footer-left"><span class="footer-text" id="footer-current-item">jul.lua</span></div>
                <div class="footer-counter" id="footer-counter">0/0</div>
            </div>
            <div id="keyboard-overlay">
                <div class="keyboard-card">
                    <div class="kb-header">
                        <div class="kb-title" id="kb-title">INPUT REQUIRED</div>
                        <div style="font-style: italic; opacity: 0.3; font-size: 10px; font-weight: 800;">JULMENU V1</div>
                    </div>
                    <div class="kb-body">
                        <div class="kb-input-display">
                            <span id="kb-text"></span>
                            <div class="kb-cursor"></div>
                        </div>
                    </div>
                    <div class="kb-footer">
                        <div class="kb-command"><span class="kb-key">[ENTER]</span> CONFIRMER</div>
                        <div class="kb-command"><span class="kb-key">[ESC]</span> ANNULER</div>
                    </div>
                </div>
            </div>
        </div>
        </div>

        <div class="info-panel" id="info-panel">
            <div class="info-header">
                <div class="info-title" id="info-p-name">PLAYER INFO</div>
                <div style="font-size: 10px; opacity: 0.3; font-weight: 800;">STATUT</div>
            </div>
            <div class="info-body" id="info-p-body">
                
            </div>
            <div class="info-footer">JULMENU MONITORING SYSTEM</div>
        </div>
    </div>
    </div>
    <script>
        let menuData = {};
        let currentMenuKey = 'main';
        let selectedIndex = 0;
        function updateMenu(tabs = []) {
            const menu = menuData[currentMenuKey] || menuData.main;
            const list = document.getElementById('items-list');
            const thumb = document.getElementById('scroll-thumb');
            const counter = document.getElementById('footer-counter');
            const tabBar = document.getElementById('tab-bar');
            const logo = document.querySelector('.logo');
            const infoPanel = document.getElementById('info-panel');
            if (window.extraData && window.extraData.playerStats) {
                const stats = window.extraData.playerStats;
                document.getElementById('info-p-name').innerText = stats.name.toUpperCase();
                const healthPercent = stats.maxHp ? (stats.hp / stats.maxHp) * 100 : 0;
                document.getElementById('info-p-body').innerHTML = 
                    '<div class="info-stat">' +
                        '<div style="display: flex; justify-content: space-between; align-items: flex-end;">' +
                            '<span class="stat-label">SANTÉ</span>' +
                            '<span class="stat-value">' + stats.hp + '/' + stats.maxHp + '</span>' +
                        '</div>' +
                        '<div class="stat-bar-bg">' +
                            '<div class="stat-bar-fill health" style="width: ' + healthPercent + '%"></div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="info-stat">' +
                        '<div style="display: flex; justify-content: space-between; align-items: flex-end;">' +
                            '<span class="stat-label">ARMURE</span>' +
                            '<span class="stat-value">' + stats.armor + '/100</span>' +
                        '</div>' +
                        '<div class="stat-bar-bg">' +
                            '<div class="stat-bar-fill armor" style="width: ' + stats.armor + '%"></div>' +
                        '</div>' +
                    '</div>' +
                    '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">' +
                        '<div class="info-stat">' +
                            '<span class="stat-label">ID SERVEUR</span>' +
                            '<span class="stat-value">#' + stats.id + '</span>' +
                        '</div>' +
                        '<div class="info-stat">' +
                            '<span class="stat-label">DISTANCE</span>' +
                            '<span class="stat-value">' + stats.distance + 'M</span>' +
                        '</div>' +
                    '</div>' +
                    '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">' +
                        '<div class="info-stat">' +
                            '<span class="stat-label">PING</span>' +
                            '<span class="stat-value" style="color: ' + (stats.ping < 60 ? '#4caf50' : '#ff9800') + '">' + stats.ping + 'MS</span>' +
                        '</div>' +
                        '<div class="info-stat">' +
                            '<span class="stat-label">TELEPHONE</span>' +
                            '<span class="stat-value">' + (stats.phone || 'N/A') + '</span>' +
                        '</div>' +
                    '</div>';
                infoPanel.style.display = 'flex';
            } else {
                infoPanel.style.display = 'none';
            }
            if (window.currentTitle && window.currentTitle !== "Main Menu") {
                logo.innerHTML = window.currentTitle.toUpperCase();
                logo.style.fontSize = window.currentTitle.length > 12 ? '22px' : '30px';
            } else {
                logo.innerHTML = 'JUL<span>MENU</span>';
                logo.style.fontSize = '34px';
            }
            let tabsHtml = '';
            if (tabs && tabs.length > 0) {
                tabsHtml = tabs.map(tab => '<div class="tab ' + (tab.active ? 'active' : '') + '">' + tab.label + '</div>').join('');
            } else {
                tabsHtml = '<div class="tab active">Menu Principal</div>';
            }
            tabsHtml += '<div class="tab-spacer"></div>';
            tabBar.innerHTML = tabsHtml;
            if (menu && menu.items) {
                list.innerHTML = menu.items.map((item, index) => {
                    const isSelected = index === selectedIndex;
                    let rightContent = '';
                    
                    if (item.type === 'toggle') {
                        const isChecked = (window.states && window.states[item.action]);
                        rightContent = '<div class="checkbox ' + (isChecked ? 'checked' : '') + '"></div>';
                    } else {
                        rightContent = '<span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span>';
                    }
                    const icon = ICONS[item.icon] || ICONS.default;
                    
                    return '<div class="menu-item ' + (isSelected ? 'selected' : '') + '">' +
                        '<span class="item-text">' + item.label + '</span>' +
                        rightContent +
                    '</div>';
                }).join('');
                const visibleCount = 10;
                const totalCount = menu.items.length;
                const sideIndicator = document.getElementById('side-indicator');
                if (totalCount > 0) {
                    const thumbHeight = Math.min(100, Math.max(10, (visibleCount / totalCount) * 100));
                    thumb.style.height = thumbHeight + '%';
                    const scrollRange = 100 - thumbHeight;
                    const scrollPos = totalCount > 1 ? (selectedIndex / (totalCount - 1)) * scrollRange : 0;
                    thumb.style.top = scrollPos + '%';
                    counter.innerText = (selectedIndex + 1) + ' / ' + totalCount;
                    if (sideIndicator) {
                        const indicatorHeight = Math.max(6, Math.min(20, (1 / totalCount) * 100));
                        const indicatorRange = 100 - indicatorHeight;
                        const indicatorPos = totalCount > 1 ? (selectedIndex / (totalCount - 1)) * indicatorRange : 0;
                        sideIndicator.style.height = indicatorHeight + '%';
                        sideIndicator.style.top = indicatorPos + '%';
                    }
                } else {
                    thumb.style.height = '0%';
                    counter.innerText = '0 / 0';
                    if (sideIndicator) sideIndicator.style.height = '0%';
                }
            }
        }
        // --- Icônes (traits fins, façon capture d'écran) ---
        const ICONS = {
            user: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>',
            globe: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 5.5 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.5-4-9s1.5-6.5 4-9z"/></svg>',
            weapon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l6-6 3 3-6 6H3v-3z"/><path d="M12 10l4-4 5 5-4 4"/></svg>',
            target: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5"/></svg>',
            car: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v-3l2-5h14l2 5v3"/><path d="M3 16h18M6 16v2M18 16v2"/><circle cx="7" cy="16" r="0.5"/><circle cx="17" cy="16" r="0.5"/></svg>',
            sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>',
            server: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><circle cx="7" cy="7" r="0.5"/><circle cx="7" cy="17" r="0.5"/></svg>',
            gear: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
            default: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>'
        };
        // --- Pont NUI : communication HTML -> Lua (inexistant en DUI) ---
        function getResourceName() {
            return (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'julmenu';
        }
        function nuiCallback(name, data = {}) {
            fetch('https://' + getResourceName() + '/' + name, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify(data)
            }).catch(() => {});
        }

        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.type === "update") {
                menuData = data.menus;
                currentMenuKey = data.menu;
                selectedIndex = data.index - 1;
                window.states = data.states;
                window.currentTitle = data.title;
                window.extraData = data.extra;
                updateMenu(data.tabs);
            }
            if (data.type === "notify") {
                showNotification(data.text, data.style);
            }
            if (data.type === "keyboard") {
                if (data.action === "open") {
                    document.getElementById('kb-title').innerText = data.title || "INPUT REQUIRED";
                    document.getElementById('kb-text').innerText = data.text || "";
                    document.getElementById('keyboard-overlay').style.display = 'flex';
                } else if (data.action === "update") {
                    document.getElementById('kb-text').innerText = data.text;
                } else if (data.action === "close") {
                    document.getElementById('keyboard-overlay').style.display = 'none';
                }
            }
        });
        // Empêche uniquement le menu contextuel natif du navigateur de s'afficher
        // (nécessaire techniquement en NUI) : aucune action du menu n'y est liée.
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- Clavier : la souris/clavier ne sont captés que par le navigateur NUI ---
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    nuiCallback('navigate', { direction: 'up' });
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    nuiCallback('navigate', { direction: 'down' });
                    break;
                case 'Enter':
                    e.preventDefault();
                    nuiCallback('select', { index: selectedIndex });
                    break;
                case 'Escape':
                case 'Backspace':
                    e.preventDefault();
                    nuiCallback('close', {});
                    break;
            }
        });

        // Le clic gauche et le clic droit ne déclenchent volontairement aucune
        // action : seule la navigation clavier (haut/bas/Entrée/Échap) pilote le menu.

        function showNotification(text, type = "info", duration = 4000) {
            const container = document.getElementById("notifications");
            if (!container) return;
            const notif = document.createElement("div");
            notif.className = "notification " + type;
            notif.innerText = text;
            container.appendChild(notif);
            
            setTimeout(() => {
                notif.style.opacity = "0";
                notif.style.transform = "translateX(50px)";
                setTimeout(() => notif.remove(), 400);
            }, duration);
        }

        updateMenu();

        // --- Mise à l'échelle selon la résolution du joueur ---
        function scaleUI() {
            const baseWidth = 1920;
            const baseHeight = 1080;
            const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
            const uiScale = document.getElementById('ui-scale');
            uiScale.style.transform = 'scale(' + scale + ')';
        }
        window.addEventListener('resize', scaleUI);
        scaleUI();
    </script>
</body>
