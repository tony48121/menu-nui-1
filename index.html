<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JULMENU</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --primary: #ff0000;
            --primary-dark: #8b0000;
            --primary-glow: rgba(255, 0, 0, 0.4);
            --bg-main: rgba(10, 10, 10, 0.98);
            --bg-card: rgba(15, 15, 15, 0.95);
            --bg-item-hover: rgba(255, 0, 0, 0.08);
            --text-main: #e0e0e0;
            --text-dim: #999;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }
        body { 
            background-color: transparent !important; 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main); 
            user-select: none; 
        }

        .container { 
            pointer-events: auto;
            padding: 40px; 
            display: flex; 
            justify-content: flex-start; 
            align-items: flex-start; 
            gap: 20px;
            min-height: 100vh; 
            transition: filter 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .container.blur { filter: blur(12px) brightness(0.5); }

        .info-panel {
            width: 280px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            animation: infoEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes infoEntry {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .info-header {
            padding: 15px 20px;
            background: #050505;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .info-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .info-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-stat {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-label {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: white;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .stat-bar-fill.health { background: #4caf50; box-shadow: 0 0 10px rgba(76, 175, 80, 0.3); }
        .stat-bar-fill.armor { background: #2196f3; box-shadow: 0 0 10px rgba(33, 150, 243, 0.3); }

        .info-footer {
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid var(--border-color);
            font-size: 10px;
            color: var(--text-dim);
            font-style: italic;
        }

        .menu-card { 
            width: 400px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 100px rgba(255, 0, 0, 0.05); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
            background-color: var(--bg-main);
            animation: menuEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes menuEntry {
            from { transform: translateX(-30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .header { 
            height: 140px; 
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            position: relative; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 120%;
            height: 50%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.15) 0%, transparent 70%);
            filter: blur(20px);
        }

        .logo { 
            font-size: 64px; 
            font-weight: 800; 
            font-style: italic; 
            color: white; 
            letter-spacing: -2px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }
        
        .logo span { color: var(--primary); }

        .tab-bar { 
            display: flex; 
            align-items: center; 
            background: #050505; 
            padding: 0 4px;
            height: 38px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab { 
            padding: 0 16px; 
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            color: var(--text-dim);
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active { 
            color: white;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            border-radius: 2px 2px 0 0;
        }

        .tab-spacer { flex: 1; }

        .menu-body { display: flex; position: relative; background: var(--bg-card); }

        .items-list { 
            flex: 1; 
            padding: 10px 0; 
            min-height: 400px; 
            max-height: 600px;
            overflow: hidden;
        }

        .menu-item { 
            position: relative; 
            padding: 12px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 2px 8px;
            border-radius: 6px;
        }

        .menu-item.selected { 
            background: var(--primary);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
            transform: scale(1.02);
        }

        .item-text { 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-main); 
        }

        .selected .item-text { color: white; }

        .checkbox { 
            width: 32px; 
            height: 16px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 10px; 
            position: relative; 
            transition: background 0.3s ease;
        }

        .checkbox::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .checkbox.checked { background: #4caf50; }
        .selected .checkbox.checked { background: white; }
        .selected .checkbox.checked::after { background: var(--primary); }
        
        .checkbox.checked::after { transform: translateX(16px); }

        .chevron { 
            color: var(--text-dim); 
            font-size: 12px; 
            font-family: 'JetBrains Mono', monospace;
        }
        .selected .chevron { color: white; }

        .scrollbar { 
            width: 4px; 
            background-color: transparent; 
            margin: 10px 4px 10px 0;
            border-radius: 2px;
        }

        .scroll-track { 
            flex: 1; 
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05); 
            border-radius: 2px; 
            position: relative; 
        }

        .scroll-thumb { 
            position: absolute; 
            width: 100%; 
            background-color: var(--primary); 
            box-shadow: 0 0 10px var(--primary-glow); 
            border-radius: 2px; 
            transition: top 0.25s cubic-bezier(0.16, 1, 0.3, 1), height 0.25s; 
        }

        .footer { 
            background-color: #050505; 
            border-top: 1px solid var(--border-color); 
            padding: 12px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        .footer-left { display: flex; align-items: center; gap: 10px; }
        .footer-logo { 
            width: 18px; 
            height: 18px; 
            background: var(--primary); 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 4px; 
            font-weight: 900; 
        }
        .footer-text { color: white; opacity: 0.8; }
        .footer-counter { 
            color: var(--primary); 
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        #keyboard-overlay { 
            position: fixed; 
            inset: 0; 
            background: transparent; 
            display: none; 
            align-items: flex-end; 
            justify-content: center; 
            z-index: 10000; 
            padding-bottom: 80px;
            pointer-events: none;
        }
        .keyboard-card { 
            width: 500px; 
            background: rgba(10, 10, 10, 0.98); 
            border: 1px solid var(--primary); 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.1); 
            animation: kbSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            pointer-events: auto;
        }
        @keyframes kbSlideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .kb-header { 
            padding: 12px 20px; 
            background: linear-gradient(to right, #1a0000, #050505);
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid rgba(255, 0, 0, 0.2); 
        }
        .kb-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); }
        .kb-body { padding: 20px; }
        .kb-input-display { 
            min-height: 50px; 
            background: #000; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 6px; 
            padding: 0 15px; 
            color: white; 
            font-size: 18px; 
            display: flex; 
            align-items: center; 
            font-family: 'JetBrains Mono', monospace;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .kb-cursor { width: 2px; height: 20px; background: var(--primary); margin-left: 4px; box-shadow: 0 0 8px var(--primary); animation: blink 1s infinite steps(2); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .kb-footer { 
            padding: 10px 20px; 
            background: #050505; 
            border-top: 1px solid rgba(255, 255, 255, 0.03); 
            display: flex; 
            justify-content: center; 
            gap: 20px;
            font-size: 9px; 
            color: var(--text-dim); 
            font-weight: 700; 
        }
        .kb-command { display: flex; align-items: center; gap: 6px; }
        .kb-key { color: var(--primary); font-weight: 800; }

        .notifications { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            z-index: 9999; 
        }
        .notification { 
            min-width: 280px; 
            padding: 16px 20px; 
            border-radius: 10px; 
            background: rgba(10, 10, 10, 0.95); 
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            font-size: 13px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .notification::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
        }
        .notification.success::before { background: #4caf50; }
        .notification.error::before { background: #f44336; }
        
        @keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="keyboard-overlay">
        <div class="keyboard-card">
            <div class="kb-header">
                <div class="kb-title" id="kb-title">INPUT REQUIRED</div>
                <div style="font-style: italic; opacity: 0.3; font-size: 10px; font-weight: 800;">JULMENU V1</div>
            </div>
            <div class="kb-body">
                <div class="kb-input-display">
                    <span id="kb-text"></span>
                    <div class="kb-cursor"></div>
                </div>
            </div>
            <div class="kb-footer">
                <div class="kb-command"><span class="kb-key">[ENTER]</span> CONFIRMER</div>
                <div class="kb-command"><span class="kb-key">[ESC]</span> ANNULER</div>
            </div>
        </div>
    </div>
    <div class="notifications" id="notifications"></div>
    <div class="container" id="main-container">
        <div class="menu-card">
            <div class="header">
                <div class="logo">JUL<span>MENU</span></div>
            </div>
            <div class="tab-bar" id="tab-bar">
                <div class="tab active">Main Menu</div>
                <div class="tab-spacer"></div>
            </div>
            <div class="menu-body">
                <div class="items-list" id="items-list"></div>
                <div class="scrollbar"><div class="scroll-track"><div class="scroll-thumb" id="scroll-thumb"></div></div></div>
            </div>
            <div class="footer">
                <div class="footer-left"><div class="footer-logo">Q</div><span class="footer-text">JULMENU MENU <span style="opacity: 0.4">V1.0</span></span></div>
                <div class="footer-counter" id="footer-counter">0/0</div>
            </div>
        </div>

        <div class="info-panel" id="info-panel">
            <div class="info-header">
                <div class="info-title" id="info-p-name">PLAYER INFO</div>
                <div style="font-size: 10px; opacity: 0.3; font-weight: 800;">STATUT</div>
            </div>
            <div class="info-body" id="info-p-body">
                
            </div>
            <div class="info-footer">JULMENU MONITORING SYSTEM</div>
        </div>
    </div>
    <script>
        let menuData = {};
        let currentMenuKey = 'main';
        let selectedIndex = 0;
        function updateMenu(tabs = []) {
            const menu = menuData[currentMenuKey] || menuData.main;
            const list = document.getElementById('items-list');
            const thumb = document.getElementById('scroll-thumb');
            const counter = document.getElementById('footer-counter');
            const tabBar = document.getElementById('tab-bar');
            const logo = document.querySelector('.logo');
            const infoPanel = document.getElementById('info-panel');
            if (window.extraData && window.extraData.playerStats) {
                const stats = window.extraData.playerStats;
                document.getElementById('info-p-name').innerText = stats.name.toUpperCase();
                const healthPercent = stats.maxHp ? (stats.hp / stats.maxHp) * 100 : 0;
                document.getElementById('info-p-body').innerHTML = 
                    '<div class="info-stat">' +
                        '<div style="display: flex; justify-content: space-between; align-items: flex-end;">' +
                            '<span class="stat-label">SANTÉ</span>' +
                            '<span class="stat-value">' + stats.hp + '/' + stats.maxHp + '</span>' +
                        '</div>' +
                        '<div class="stat-bar-bg">' +
                            '<div class="stat-bar-fill health" style="width: ' + healthPercent + '%"></div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="info-stat">' +
                        '<div style="display: flex; justify-content: space-between; align-items: flex-end;">' +
                            '<span class="stat-label">ARMURE</span>' +
                            '<span class="stat-value">' + stats.armor + '/100</span>' +
                        '</div>' +
                        '<div class="stat-bar-bg">' +
                            '<div class="stat-bar-fill armor" style="width: ' + stats.armor + '%"></div>' +
                        '</div>' +
                    '</div>' +
                    '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">' +
                        '<div class="info-stat">' +
                            '<span class="stat-label">ID SERVEUR</span>' +
                            '<span class="stat-value">#' + stats.id + '</span>' +
                        '</div>' +
                        '<div class="info-stat">' +
                            '<span class="stat-label">DISTANCE</span>' +
                            '<span class="stat-value">' + stats.distance + 'M</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="info-stat">' +
                        '<span class="stat-label">PING</span>' +
                        '<span class="stat-value" style="color: ' + (stats.ping < 60 ? '#4caf50' : '#ff9800') + '">' + stats.ping + 'MS</span>' +
                    '</div>';
                infoPanel.style.display = 'flex';
            } else {
                infoPanel.style.display = 'none';
            }
            if (window.currentTitle && window.currentTitle !== "Main Menu") {
                logo.innerHTML = window.currentTitle.toUpperCase();
                logo.style.fontSize = window.currentTitle.length > 12 ? '32px' : '48px';
            } else {
                logo.innerHTML = 'JUL<span>MENU</span>';
                logo.style.fontSize = '64px';
            }
            let tabsHtml = '';
            if (tabs && tabs.length > 0) {
                tabsHtml = tabs.map(tab => '<div class="tab ' + (tab.active ? 'active' : '') + '">' + tab.label + '</div>').join('');
            } else {
                tabsHtml = '<div class="tab active">Menu Principal</div>';
            }
            tabsHtml += '<div class="tab-spacer"></div>';
            tabBar.innerHTML = tabsHtml;
            if (menu && menu.items) {
                list.innerHTML = menu.items.map((item, index) => {
                    const isSelected = index === selectedIndex;
                    let rightContent = '';
                    
                    if (item.type === 'toggle') {
                        const isChecked = (window.states && window.states[item.action]);
                        rightContent = '<div class="checkbox ' + (isChecked ? 'checked' : '') + '"></div>';
                    } else {
                        rightContent = '<span class="chevron">' + (item.submenu ? '>>' : '>') + '</span>';
                    }
                    
                    return '<div class="menu-item ' + (isSelected ? 'selected' : '') + '">' +
                        '<span class="item-text">' + item.label + '</span>' +
                        rightContent +
                    '</div>';
                }).join('');
                const visibleCount = 10;
                const totalCount = menu.items.length;
                if (totalCount > 0) {
                    const thumbHeight = Math.min(100, Math.max(10, (visibleCount / totalCount) * 100));
                    thumb.style.height = thumbHeight + '%';
                    const scrollRange = 100 - thumbHeight;
                    const scrollPos = totalCount > 1 ? (selectedIndex / (totalCount - 1)) * scrollRange : 0;
                    thumb.style.top = scrollPos + '%';
                    counter.innerText = (selectedIndex + 1) + ' / ' + totalCount;
                } else {
                    thumb.style.height = '0%';
                    counter.innerText = '0 / 0';
                }
            }
        }
        // --- Pont NUI : communication HTML -> Lua (inexistant en DUI) ---
        function getResourceName() {
            return (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'julmenu';
        }
        function nuiCallback(name, data = {}) {
            fetch('https://' + getResourceName() + '/' + name, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify(data)
            }).catch(() => {});
        }

        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.type === "update") {
                menuData = data.menus;
                currentMenuKey = data.menu;
                selectedIndex = data.index - 1;
                window.states = data.states;
                window.currentTitle = data.title;
                window.extraData = data.extra;
                updateMenu(data.tabs);
            }
            if (data.type === "notify") {
                showNotification(data.text, data.style);
            }
            if (data.type === "keyboard") {
                if (data.action === "open") {
                    document.getElementById('kb-title').innerText = data.title || "INPUT REQUIRED";
                    document.getElementById('kb-text').innerText = data.text || "";
                    document.getElementById('keyboard-overlay').style.display = 'flex';
                } else if (data.action === "update") {
                    document.getElementById('kb-text').innerText = data.text;
                } else if (data.action === "close") {
                    document.getElementById('keyboard-overlay').style.display = 'none';
                }
            }
        });
        const blockEvent = (e) => {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
        };
        //document.addEventListener('click', blockEvent, true);
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- Clavier : la souris/clavier ne sont captés que par le navigateur NUI ---
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    nuiCallback('navigate', { direction: 'up' });
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    nuiCallback('navigate', { direction: 'down' });
                    break;
                case 'Enter':
                    e.preventDefault();
                    nuiCallback('select', { index: selectedIndex });
                    break;
                case 'Escape':
                case 'Backspace':
                    e.preventDefault();
                    nuiCallback('close', {});
                    break;
            }
        });

        // --- Souris : clic direct sur un item (impossible en DUI) ---
        document.getElementById('items-list').addEventListener('click', function(e) {
            const item = e.target.closest('.menu-item');
            if (!item) return;
            const index = Array.from(item.parentElement.children).indexOf(item);
            nuiCallback('select', { index: index });
        });

        // --- Clic en dehors du menu = fermeture ---
        document.getElementById('main-container').addEventListener('click', function(e) {
            if (!e.target.closest('.menu-card')) {
                nuiCallback('close', {});
            }
        });

        function showNotification(text, type = "info", duration = 4000) {
            const container = document.getElementById("notifications");
            if (!container) return;
            const notif = document.createElement("div");
            notif.className = "notification " + type;
            notif.innerText = text;
            container.appendChild(notif);
            
            setTimeout(() => {
                notif.style.opacity = "0";
                notif.style.transform = "translateX(50px)";
                setTimeout(() => notif.remove(), 400);
            }, duration);
        }

        updateMenu();
    </script>
</body>
</html>
