<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JuL Keyser UI</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif}
</style>
</head>
<body>
<script>
  (function () {
    var t = "";
    try { t = new URLSearchParams(location.search).get("t") || ""; } catch (e) {}
    if (!t && window.__julKeyserToken) t = window.__julKeyserToken;
    window.__julKeyserToken = t || "jul_keyser";
  })();
</script>
<script>

(function () {
  "use strict";

  var TOKEN = window.__julKeyserToken || "";
  var existing = window.__julKeyserUI;
  if (existing && existing.setToken) {
    existing.setToken(TOKEN);
    return;
  }

  var HOST_ID = "jul-keyser-host";
  var oldHost = document.getElementById(HOST_ID);
  if (oldHost) oldHost.remove();

  var host = document.createElement("div");
  host.id = HOST_ID;
  host.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:none;pointer-events:auto;";
  var shadow = host.attachShadow({ mode: "open" });

  var CSS = [
    "*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:Inter,'Segoe UI',system-ui,sans-serif;user-select:none}",
    "#jul-root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,7,10,.52);backdrop-filter:blur(3px);color:#e8e8e8;font-size:14px;line-height:1.35;overflow:hidden}",
    ".hidden{display:none!important}",
    "::-webkit-scrollbar{width:4px;height:4px}",
    "::-webkit-scrollbar-thumb{background:#2b2c32;border-radius:10px}",
    ".keyser-menu{width:min(900px,94vw);height:min(580px,88vh);background:#18191d;border:1px solid rgba(255,255,255,.04);border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.65);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s ease}",
    "header{display:flex;align-items:center;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.04);gap:16px;flex:0 0 auto}",
    ".logo{width:165px;flex:0 0 165px}",
    ".logo h1{font-size:25px;font-weight:700;color:#b9b9c2;letter-spacing:.5px}",
    ".logo span{display:block;font-size:11px;font-weight:600;color:#5a5a62;margin-top:1px}",
    ".top-nav{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-width:0}",
    ".top-nav button{background:transparent;border:0;color:#8a8a92;padding:9px 13px;font-size:13.5px;font-weight:600;border-radius:4px;cursor:pointer;transition:.15s;white-space:nowrap}",
    ".top-nav button:hover{color:#fff;background:rgba(255,255,255,.03)}",
    ".top-nav button.active{background:#1e1e24;color:#fff}",
    ".head-actions{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}",
    ".icon-btn{width:30px;height:30px;border-radius:5px;border:1px solid rgba(255,255,255,.05);background:#1e1e24;color:#8a8a92;cursor:pointer;font-size:13px;display:grid;place-items:center;transition:.15s}",
    ".icon-btn:hover{color:#fff;background:#26272e}",
    ".main{display:flex;flex:1;min-height:0}",
    ".sidebar{width:210px;flex:0 0 210px;border-right:1px solid rgba(255,255,255,.04);padding:10px 0;overflow-y:auto;display:flex;flex-direction:column}",
    ".sidebar ul{list-style:none}",
    ".sidebar li{padding:12px 20px;color:#8a8a92;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s;margin-bottom:1px}",
    ".sidebar li:hover{color:#e8e8e8;background:rgba(255,255,255,.02)}",
    ".sidebar li.active{background:#2a2b32;color:#fff}",
    ".side-icon{width:18px;text-align:center;flex:0 0 18px;font-size:13px;color:#6a6a74}",
    ".sidebar li.active .side-icon{color:#fff}",
    ".side-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
    ".side-foot{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:6px}",
    ".side-hint{font-size:10.5px;color:#5a5a62;font-weight:600;margin-bottom:2px}",
    ".side-hint b{color:#8a8a92}",
    ".side-btn{background:#18191d;border:1px solid rgba(255,255,255,.03);color:#8a8a92;border-radius:4px;padding:8px 10px;font-size:11.5px;font-weight:600;text-align:left;cursor:pointer;transition:.15s}",
    ".side-btn:hover{background:#26272e;color:#fff}",
    ".content{flex:1;min-width:0;overflow-y:auto;padding:15px;background:#18191d}",
    ".content-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}",
    ".content-head h2{font-size:18px;font-weight:600;color:#fff;letter-spacing:.2px}",
    ".crumb{display:flex;gap:5px;flex-wrap:wrap;font-size:11px;color:#5a5a62;align-items:center}",
    ".crumb button{background:none;border:0;color:#8a8a92;cursor:pointer;font-size:11px;padding:1px 0;font-weight:600}",
    ".crumb button:hover{color:#fff}",
    ".crumb .sep{color:#3a3a42}",
    ".grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}",
    ".panel{background:#1e1e24;border:1px solid rgba(255,255,255,.015);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}",
    ".panel.wide{grid-column:1/-1}",
    ".panel h3{font-size:14.5px;font-weight:600;color:#fff;margin-bottom:6px;letter-spacing:.2px}",
    ".row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;color:#8a8a92;font-size:13.5px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.025);cursor:pointer;transition:color .12s}",
    ".row:last-child{border-bottom:0}",
    ".row:hover{color:#e8e8e8}",
    ".row-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}",
    ".row-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
    ".row-desc{font-size:10.5px;font-weight:500;color:#5a5a62;line-height:1.25;white-space:normal}",
    ".row:hover .row-desc{color:#7a7a84}",
    ".chev{color:#5a5a62;font-size:16px;flex:0 0 auto}",
    ".checkbox{width:18px;height:18px;flex:0 0 18px;border-radius:4px;background:#18191d;border:1px solid rgba(255,255,255,.06);position:relative;transition:.15s}",
    ".row.on .checkbox{background:#8c8c96;border-color:transparent}",
    ".row.on .checkbox:after{content:'\\2714';position:absolute;inset:0;display:grid;place-items:center;color:#18191d;font-size:11px}",
    ".btn{background:#18191d;color:#b9b9c2;border:1px solid rgba(255,255,255,.03);padding:10px 12px;border-radius:4px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;transition:.15s;margin:4px 0}",
    ".btn:hover{background:#26272e;color:#fff;border-color:rgba(255,255,255,.06)}",
    ".btn .row-desc{display:block;margin-top:2px}",
    ".slider{display:flex;flex-direction:column;gap:7px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.025)}",
    ".slider:last-child{border-bottom:0}",
    ".slider-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13.5px;font-weight:600;color:#8a8a92}",
    ".slider-head .val{background:#18191d;color:#8a8a92;font-size:11px;padding:3px 7px;border-radius:3px;font-weight:700;flex:0 0 auto}",
    "input[type=range]{-webkit-appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;outline:none}",
    "input[type=range]::-webkit-slider-runnable-track{height:4px;background:#2b2c32;border-radius:2px}",
    "input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#b9b9c2;margin-top:-5px;box-shadow:0 0 5px rgba(0,0,0,.5)}",
    ".select{background:#15161a;border:1px solid rgba(255,255,255,.04);color:#b9b9c2;padding:8px 10px;border-radius:4px;font-size:12.5px;font-weight:600;outline:none;cursor:pointer;max-width:100%}",
    ".cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}",
    ".cat-card{background:#1e1e24;border:1px solid rgba(255,255,255,.02);border-radius:6px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;color:#b9b9c2;text-align:left}",
    ".cat-card:hover{background:#26272e;color:#fff;transform:translateY(-1px)}",
    ".cat-card .ci{font-size:22px;width:30px;text-align:center;flex:0 0 30px}",
    ".cat-card .ct{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
    ".chooser{width:min(560px,92vw);background:#18191d;border:1px solid rgba(255,255,255,.04);border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.7);padding:30px 32px 24px;animation:pop .22s ease}",
    ".chooser .brand{font-size:27px;font-weight:700;color:#b9b9c2;letter-spacing:.5px}",
    ".chooser .sub{color:#5a5a62;font-size:12px;font-weight:600;margin-top:2px}",
    ".chooser h2{color:#fff;font-size:18px;font-weight:600;margin:24px 0 14px}",
    ".choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}",
    ".choice{background:#1e1e24;border:1px solid rgba(255,255,255,.03);border-radius:8px;padding:18px;text-align:left;color:#8a8a92;cursor:pointer;transition:.15s;font-family:inherit}",
    ".choice:hover{background:#26272e;color:#e8e8e8}",
    ".choice.sel{border-color:#8c8c96;background:#26272e;color:#fff;box-shadow:0 0 0 1px rgba(140,140,150,.35) inset}",
    ".choice .ci{font-size:24px;margin-bottom:10px}",
    ".choice .ct{font-size:15px;font-weight:700;color:#fff}",
    ".choice .cd{font-size:11.5px;color:#5a5a62;font-weight:500;margin-top:4px;line-height:1.3}",
    ".chooser .hint{color:#5a5a62;font-size:11px;font-weight:600;margin-top:18px;text-align:center}",
    ".input-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,7,10,.55);backdrop-filter:blur(2px);z-index:20}",
    ".input-card{width:min(420px,92vw);background:#1e1e24;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.7)}",
    ".input-card h3{color:#fff;font-size:15px;font-weight:600;margin-bottom:12px}",
    ".input-card input{width:100%;background:#15161a;border:1px solid rgba(255,255,255,.06);border-radius:4px;padding:11px 12px;color:#fff;font-size:14px;outline:none}",
    ".input-card input:focus{border-color:#8c8c96}",
    ".input-card .keybox{background:#15161a;border:1px dashed rgba(255,255,255,.12);border-radius:6px;padding:22px;text-align:center;color:#fff;font-size:18px;font-weight:700;letter-spacing:1px}",
    ".input-card .hint{color:#5a5a62;font-size:11px;margin-top:9px;font-weight:600}",
    ".input-actions{display:flex;gap:8px;margin-top:16px}",
    ".input-actions button{flex:1;padding:10px;border-radius:4px;border:1px solid rgba(255,255,255,.04);background:#18191d;color:#b9b9c2;font-size:13px;font-weight:600;cursor:pointer}",
    ".input-actions button.primary{background:#8c8c96;color:#18191d;border-color:transparent}",
    ".input-actions button:hover{filter:brightness(1.1)}",
    ".toasts{position:absolute;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:330px;pointer-events:none}",
    ".toast{background:#1e1e24;border:1px solid rgba(255,255,255,.05);border-left:3px solid #8c8c96;border-radius:5px;padding:11px 13px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:slideIn .2s ease}",
    ".toast.success{border-left-color:#7ec98b}.toast.error{border-left-color:#d97373}.toast.info{border-left-color:#7ea6d9}",
    ".toast .th{font-size:10.5px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px}",
    ".toast .tm{font-size:12px;color:#8a8a92;margin-top:3px;line-height:1.3}",
    "@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}",
    "@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}"
  ].join("\n");

  var HTML = [
    '<div id="jul-root" class="hidden">',
    '  <div id="jul-chooser" class="hidden"></div>',
    '  <div id="jul-menu" class="keyser-menu hidden">',
    '    <header>',
    '      <div class="logo"><h1>Keyser</h1><span>discord.gg/keyser</span></div>',
    '      <nav class="top-nav" id="jul-topnav"></nav>',
    '      <div class="head-actions">',
    '        <button class="icon-btn" data-act="switch" title="Switch to keyboard UI">&#9000;</button>',
    '        <button class="icon-btn" data-act="close" title="Close menu">&#10005;</button>',
    '      </div>',
    '    </header>',
    '    <div class="main">',
    '      <aside class="sidebar" id="jul-sidebar"></aside>',
    '      <main class="content" id="jul-content"></main>',
    '    </div>',
    '  </div>',
    '  <div id="jul-input-wrap" class="input-wrap hidden"></div>',
    '  <div id="jul-toasts" class="toasts"></div>',
    '</div>'
  ].join("\n");

  shadow.innerHTML = "<style>" + CSS + "</style>" + HTML;
  document.documentElement.appendChild(host);
  window.__julShow = function () { openView(); };
  window.__julHide = function () { closeView(); };

  // Persist the host even if the Svelte app re-renders the DOM.
  try {
    var obs = new MutationObserver(function () {
      if (!document.getElementById(HOST_ID)) {
        document.documentElement.appendChild(host);
      }
    });
    obs.observe(document.documentElement, { childList: true, subtree: true });
  } catch (e) {}


  function $(sel) { return shadow.querySelector(sel); }

  var root = $("#jul-root");
  var chooserEl = $("#jul-chooser");
  var menuEl = $("#jul-menu");
  var contentEl = $("#jul-content");
  var sidebarEl = $("#jul-sidebar");
  var topnavEl = $("#jul-topnav");
  var inputWrap = $("#jul-input-wrap");
  var toastWrap = $("#jul-toasts");

  var state = {
    categories: [], tabs: [], tabIndex: 0, menu: [], current: 1,
    breadcrumb: [], title: "", home: true, activeCategory: "",
    depth: 0, menuKey: "", input: null
  };
  var view = "none";
  var chooserSel = 0;
  var input = null;
  var inputField = null;
  var dragging = null;
  var pendingState = null;
  var lastStateJson = "";
  var lastNavKey = "";
  var session = Math.random().toString(36).slice(2) + Date.now().toString(36);
  var seq = 0;
  var sliderTimer = null;
  var sliderPending = null;

  function nativeSet(name, value) {
    try {
      if (typeof window.invokeNative === "function") {
        window.invokeNative("setConvar", JSON.stringify({ name: name, value: String(value) }));
        return true;
      }
    } catch (e) {}
    return false;
  }

  function ready() {
    if (TOKEN) nativeSet("jul_keyser_ready", TOKEN);
  }

  function send(cmd) {
    cmd = cmd || {};
    cmd.julKeyser = true;
    cmd.s = session;
    cmd.n = ++seq;
    nativeSet("jul_mouse_cmd", JSON.stringify(cmd));
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var ICONS = {
    "ph-user": "\uD83D\uDC64", "ph-globe": "\uD83C\uDF10", "ph-crosshair": "\uD83C\uDFAF",
    "ph-car": "\uD83D\uDE97", "ph-bomb": "\uD83D\uDCA3", "ph-wrench": "\uD83D\uDD27",
    "ph-gear": "\u2699", "ph-shield": "\uD83D\uDEE1", "ph-eye": "\uD83D\uDC41",
    "ph-lightning": "\u26A1", "ph-robot": "\uD83E\uDD16", "ph-skull": "\uD83D\uDC80",
    "ph-flag": "\uD83C\uDFC1", "ph-house": "\uD83C\uDFE0", "ph-gamepad": "\uD83C\uDFAE"
  };
  function icon(name) {
    return ICONS[String(name || "")] || "\u25C6";
  }

  function fmt(v) {
    var n = Number(v);
    if (!isFinite(n)) return "0";
    return String(Math.round(n * 100) / 100);
  }
  function num(v, d) {
    var n = Number(v);
    return isFinite(n) ? n : d;
  }

  function renderChooser() {
    var modes = [
      { id: "mouse", icon: "\uD83D\uDDB1", title: "Mouse", desc: "Keyser interface \u00B7 click through every option" },
      { id: "keyboard", icon: "\u2328", title: "Keyboard", desc: "Sky interface \u00B7 arrows, Enter, Backspace" }
    ];
    chooserEl.innerHTML = '<div class="chooser">' +
      '<div class="brand">Keyser</div><div class="sub">discord.gg/keyser</div>' +
      '<h2>Choose your interface</h2><div class="choices">' +
      modes.map(function (m, i) {
        return '<button class="choice' + (i === chooserSel ? " sel" : "") + '" data-act="choose" data-mode="' + m.id + '">' +
          '<div class="ci">' + m.icon + '</div><div class="ct">' + m.title + '</div><div class="cd">' + m.desc + '</div></button>';
      }).join("") +
      '</div><div class="hint">\u2190 \u2192 to choose \u00B7 Enter to confirm \u00B7 Esc to cancel</div></div>';
  }

  function renderMenu() {
    if (!state || state.home) {
      var cats = state.categories || [];
      var cards = cats.map(function (c) {
        return '<button class="cat-card" data-act="category" data-i="' + c.i + '">' +
          '<span class="ci">' + icon(c.icon) + '</span><span class="ct">' + esc(c.label) + '</span></button>';
      }).join("");
      topnavEl.innerHTML = cats.map(function (c) {
        return '<button data-act="category" data-i="' + c.i + '">' + esc(c.label) + '</button>';
      }).join("");
      sidebarEl.innerHTML = '<ul><li class="active"><span class="side-icon">\u2302</span><span class="side-label">Home</span></li></ul>' +
        '<div class="side-foot">' + sideFoot() + '</div>';
      contentEl.innerHTML = '<div class="content-head"><h2>Home</h2><div class="crumb">Select a category</div></div>' +
        '<div class="cat-grid">' + (cards || '<div class="row"><span class="row-label">No categories</span></div>') + '</div>';
      return;
    }

    var navKey = (state.activeCategory || "") + "|" + (state.title || "") + "|" + state.depth;
    var keepScroll = navKey === lastNavKey;
    lastNavKey = navKey;
    var contentScroll = keepScroll ? contentEl.scrollTop : 0;
    var sideScroll = keepScroll ? sidebarEl.scrollTop : 0;

    topnavEl.innerHTML = (state.categories || []).map(function (c) {
      return '<button data-act="category" data-i="' + c.i + '" class="' + (c.label === state.activeCategory ? "active" : "") + '">' + esc(c.label) + '</button>';
    }).join("");

    var side = "";
    if (state.tabs && state.tabs.length) {
      side += '<ul>' + state.tabs.map(function (t, i) {
        return '<li data-act="tab" data-i="' + i + '" class="' + (i === state.tabIndex ? "active" : "") + '">' +
          '<span class="side-icon">' + (i === state.tabIndex ? "\u25B8" : "\u00B7") + '</span><span class="side-label">' + esc(t) + '</span></li>';
      }).join("") + '</ul>';
    } else {
      side += '<ul>';
      side += '<li data-act="home"><span class="side-icon">\u2302</span><span class="side-label">Home</span></li>';
      side += '<li data-act="back"><span class="side-icon">\u2190</span><span class="side-label">Back</span></li>';
      side += '</ul>';
    }
    side += '<div class="side-foot">' + sideFoot() + '</div>';
    sidebarEl.innerHTML = side;

    var crumbs = (state.breadcrumb || []).map(function (c, i) {
      var tabAttr = (c.tab !== undefined && c.tab !== null) ? ' data-tab="' + c.tab + '"' : "";
      return (i ? '<span class="sep">/</span>' : "") +
        '<button data-act="crumb" data-depth="' + num(c.depth, 0) + '"' + tabAttr + '>' + esc(c.label) + '</button>';
    }).join("");

    var sections = [];
    var cur = { title: state.title || "Options", items: [] };
    (state.menu || []).forEach(function (it) {
      if (it.type === "divider") {
        if (cur.items.length) sections.push(cur);
        cur = { title: it.label || "Options", items: [] };
      } else {
        cur.items.push(it);
      }
    });
    if (cur.items.length || !sections.length) sections.push(cur);

    var panels = [];
    sections.forEach(function (s) {
      if (s.items.length <= 9) {
        panels.push(s);
      } else {
        for (var i = 0; i < s.items.length; i += 8) {
          panels.push({ title: i === 0 ? s.title : s.title + " (cont.)", items: s.items.slice(i, i + 8) });
        }
      }
    });

    var grid = '<div class="grid">';
    panels.forEach(function (p) {
      var wide = p.items.length > 8 || p.items.some(function (it) {
        return (it.types || []).indexOf("slider") >= 0;
      });
      grid += '<section class="panel' + (wide ? " wide" : "") + '">' +
        (p.title ? '<h3>' + esc(p.title) + '</h3>' : "") +
        '<div class="rows">' + p.items.map(renderItem).join("") + '</div></section>';
    });
    grid += '</div>';

    contentEl.innerHTML = '<div class="content-head"><h2>' + esc(state.title || "Menu") + '</h2><div class="crumb">' + crumbs + '</div></div>' + grid;
    contentEl.scrollTop = contentScroll;
    sidebarEl.scrollTop = sideScroll;
  }

  function sideFoot() {
    var out = "";
    if (state.menuKey) out += '<div class="side-hint">Press <b>' + esc(state.menuKey) + '</b> to close</div>';
    out += '<button class="side-btn" data-act="switch">\u2328 Keyboard UI</button>';
    out += '<button class="side-btn" data-act="close">\u2715 Close menu</button>';
    return out;
  }

  function renderItem(it) {
    var types = it.types || [];
    var label = esc(it.label || "");
    var desc = it.desc ? '<div class="row-desc">' + esc(it.desc) + '</div>' : "";

    if (types.indexOf("submenu") >= 0) {
      return '<div class="row" data-act="activate" data-i="' + it.i + '"><div class="row-main"><div class="row-label">' + label + '</div>' + desc + '</div><span class="chev">\u203A</span></div>';
    }

    var onlyButton = types.indexOf("button") >= 0 && types.indexOf("checkbox") < 0 && types.indexOf("slider") < 0 && types.indexOf("scroll") < 0;
    if (onlyButton) {
      return '<button class="btn" data-act="activate" data-i="' + it.i + '">' + label + desc + '</button>';
    }

    var html = "";
    if (types.indexOf("checkbox") >= 0) {
      html += '<div class="row' + (it.checked ? " on" : "") + '" data-act="toggle" data-i="' + it.i + '">' +
        '<div class="row-main"><div class="row-label">' + label + '</div>' + desc + '</div><span class="checkbox"></span></div>';
    }
    if (types.indexOf("slider") >= 0) {
      html += '<div class="slider"><div class="slider-head"><span>' + label + '</span><span class="val" data-val-i="' + it.i + '">' + fmt(it.value) + '</span></div>' +
        '<input type="range" data-act="slider" data-i="' + it.i + '" min="' + num(it.min, 0) + '" max="' + num(it.max, 100) + '" step="' + num(it.step, 1) + '" value="' + num(it.value, 0) + '">' +
        (types.indexOf("checkbox") < 0 ? desc : "") + '</div>';
    }
    if (types.indexOf("scroll") >= 0) {
      var opts = it.options || [];
      var sel = Math.max(0, Math.min(opts.length - 1, (num(it.selected, 1) - 1)));
      html += '<div class="slider"><div class="slider-head"><span>' + label + '</span></div>' +
        '<select class="select" data-act="scrollset" data-i="' + it.i + '">' +
        opts.map(function (o, j) {
          return '<option value="' + j + '"' + (j === sel ? " selected" : "") + '>' + esc(o.label) + '</option>';
        }).join("") + '</select>' + desc + '</div>';
    }
    if (types.indexOf("button") >= 0) {
      html += '<button class="btn" data-act="activate" data-i="' + it.i + '">Run</button>';
    }
    return html;
  }

  function setState(st) {
    if (!st || typeof st !== "object") return;
    state = Object.assign({}, state, st);
    if (dragging) { pendingState = st; return; }
    applyState(st);
  }

  function applyState(st) {
    state = Object.assign({}, state, st);
    var j = JSON.stringify(state);
    if (j === lastStateJson && view === "menu") return;
    lastStateJson = j;
    if (view === "menu") renderMenu();
  }

  function showInput(data) {
    input = {
      title: data.title || "",
      value: data.value == null ? "" : String(data.value),
      mode: data.mode || "typeable"
    };
    var isKey = input.mode === "keybind" || input.mode === "itemkeybind";
    inputWrap.classList.remove("hidden");
    inputWrap.innerHTML = '<div class="input-card"><h3>' + esc(input.title) + '</h3>' +
      (isKey
        ? '<div class="keybox" id="jul-keybox">' + esc(input.value || "Press any key...") + '</div><div class="hint">Press the key to bind \u00B7 Enter to confirm \u00B7 Esc to cancel</div>'
        : '<input id="jul-input-field" type="text" value="' + esc(input.value) + '" autocomplete="off" spellcheck="false"><div class="hint">Enter to confirm \u00B7 Esc to cancel</div>') +
      '<div class="input-actions"><button data-act="inputCancel">Cancel</button><button class="primary" data-act="inputSubmit">Confirm</button></div></div>';
    inputField = $("#jul-input-field");
    if (inputField) {
      inputField.focus();
      try { inputField.setSelectionRange(inputField.value.length, inputField.value.length); } catch (e) {}
      inputField.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); submitInput(); }
        else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); send({ cmd: "inputCancel" }); }
      });
    }
  }

  function updateInput(data) {
    if (!input) return;
    if (data.value !== undefined) input.value = String(data.value);
    var kb = $("#jul-keybox");
    if (kb) kb.textContent = input.value || "Press any key...";
    if (inputField && shadow.activeElement !== inputField && data.value !== undefined) {
      inputField.value = input.value;
    }
  }

  function hideInput() {
    input = null;
    inputField = null;
    inputWrap.classList.add("hidden");
    inputWrap.innerHTML = "";
  }

  function submitInput() {
    if (!input) return;
    if (inputField) input.value = inputField.value;
    send({ cmd: "inputSubmit", value: input.value });
  }

  function notify(data) {
    var el = document.createElement("div");
    el.className = "toast " + (data.type || "info");
    el.innerHTML = '<div class="th">' + esc(data.header || "Info") + '</div><div class="tm">' + esc(data.message || "") + '</div>';
    toastWrap.appendChild(el);
    while (toastWrap.children.length > 4) toastWrap.removeChild(toastWrap.firstChild);
    var ms = Math.max(1200, Math.min(8000, num(data.duration, 4000)));
    setTimeout(function () {
      el.style.opacity = "0";
      el.style.transition = "opacity .25s";
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    }, ms);
  }

  function setChoice(i) {
    chooserSel = Math.max(0, Math.min(1, i));
    var els = chooserEl.querySelectorAll(".choice");
    for (var k = 0; k < els.length; k++) {
      els[k].classList.toggle("sel", k === chooserSel);
    }
  }

  function choose(mode) {
    send({ cmd: "choose", mode: mode });
  }

  function openView() {
    host.style.display = "block";
    root.classList.remove("hidden");
  }

  function closeView() {
    host.style.display = "none";
    root.classList.add("hidden");
  }

  function throttleSlider(i, v) {
    sliderPending = { i: i, v: v };
    if (sliderTimer) return;
    sliderTimer = setTimeout(function () {
      sliderTimer = null;
      if (sliderPending) {
        send({ cmd: "slider", index: sliderPending.i, value: sliderPending.v, commit: false });
        sliderPending = null;
      }
    }, 80);
  }

  shadow.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");
    var i = el.getAttribute("data-i");
    if (act === "choose") { choose(el.getAttribute("data-mode")); }
    else if (act === "category") { send({ cmd: "category", index: Number(i) }); }
    else if (act === "tab") { send({ cmd: "tab", index: Number(i) }); }
    else if (act === "activate" || act === "toggle") { send({ cmd: act, index: Number(i) }); }
    else if (act === "back") { send({ cmd: "back" }); }
    else if (act === "home") { send({ cmd: "home" }); }
    else if (act === "crumb") {
      var depth = Number(el.getAttribute("data-depth"));
      var tab = el.getAttribute("data-tab");
      send({ cmd: "crumb", depth: depth, tab: tab === null ? undefined : Number(tab) });
    }
    else if (act === "close") { send({ cmd: "close" }); }
    else if (act === "switch") { send({ cmd: "switch" }); }
    else if (act === "inputCancel") { send({ cmd: "inputCancel" }); }
    else if (act === "inputSubmit") { submitInput(); }
  });

  shadow.addEventListener("input", function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute("data-act") !== "slider") return;
    var i = Number(el.getAttribute("data-i"));
    dragging = { i: i, value: Number(el.value) };
    var lab = shadow.querySelector('[data-val-i="' + i + '"]');
    if (lab) lab.textContent = fmt(el.value);
    throttleSlider(i, Number(el.value));
  });

  shadow.addEventListener("change", function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var act = el.getAttribute("data-act");
    if (act === "slider") {
      var i = Number(el.getAttribute("data-i"));
      dragging = null;
      send({ cmd: "slider", index: i, value: Number(el.value), commit: true });
      if (pendingState) { applyState(pendingState); pendingState = null; }
    } else if (act === "scrollset") {
      send({ cmd: "scroll", index: Number(el.getAttribute("data-i")), selected: Number(el.value) + 1 });
    }
  });

  window.addEventListener("keydown", function (e) {
    if (view === "none") return;
    var mk = String(state.menuKey || "").toUpperCase();
    var ek = String(e.key || "").toUpperCase();
    if (mk && ek === mk) {
      e.preventDefault();
      e.stopPropagation();
      if (!input) send({ cmd: "menuKey" });
      return;
    }
    if (input) {
      if (e.key === "Escape") {
        e.preventDefault();
        e.stopPropagation();
        send({ cmd: "inputCancel" });
        return;
      }
      if (input.mode === "keybind" || input.mode === "itemkeybind") {
        e.preventDefault();
        e.stopPropagation();
        if (e.key === "Enter") { send({ cmd: "inputSubmit" }); return; }
        var vk = e.keyCode || e.which;
        if (vk && vk !== 13 && vk !== 27) send({ cmd: "inputKey", keyCode: vk });
        return;
      }
      return;
    }
    if (view === "chooser") {
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); setChoice(0); }
      else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); setChoice(1); }
      else if (e.key === "Enter") { e.preventDefault(); choose(chooserSel === 0 ? "mouse" : "keyboard"); }
      else if (e.key === "Escape") { e.preventDefault(); choose("cancel"); }
      return;
    }
    if (view === "menu") {
      if (e.key === "Escape") { e.preventDefault(); send({ cmd: "close" }); }
      else if (e.key === "Backspace") {
        var tag = e.target && e.target.tagName ? e.target.tagName : "";
        if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") {
          e.preventDefault();
          send({ cmd: "back" });
        }
      }
    }
  }, true);

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.julKeyser !== true) return;
    var a = d.action;
    if (a === "ping") { ready(); return; }
    if (a === "chooserShow") {
      view = "chooser";
      if (d.menuKey) state.menuKey = String(d.menuKey);
      chooserSel = Math.max(0, Math.min(1, num(d.selected, 1) - 1));
      renderChooser();
      chooserEl.classList.remove("hidden");
      menuEl.classList.add("hidden");
      hideInput();
      openView();
      return;
    }
    if (a === "chooserSelect") {
      if (view === "chooser") setChoice(num(d.selected, 1) - 1);
      return;
    }
    if (a === "chooserHide") {
      if (view === "chooser") { view = "none"; chooserEl.classList.add("hidden"); closeView(); }
      return;
    }
    if (a === "show") {
      view = "menu";
      chooserEl.classList.add("hidden");
      menuEl.classList.remove("hidden");
      openView();
      if (state && (state.menu || state.home)) renderMenu();
      return;
    }
    if (a === "hide") {
      view = "none";
      dragging = null;
      pendingState = null;
      chooserEl.classList.add("hidden");
      menuEl.classList.add("hidden");
      hideInput();
      closeView();
      return;
    }
    if (a === "state") { setState(d); return; }
    if (a === "notify") { notify(d); return; }
    if (a === "inputShow") { showInput(d); return; }
    if (a === "inputUpdate") { updateInput(d); return; }
    if (a === "inputHide") { hideInput(); return; }
  });

  window.__julKeyserUI = {
    setToken: function (t) { TOKEN = t; ready(); },
    ping: ready
  };

  ready();
  setTimeout(ready, 400);
  setTimeout(ready, 1200);
})();


</script>
</body>
</html>
